<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E5A9" />
      <stop offset="50%" stop-color="#CBA147" />
      <stop offset="100%" stop-color="#9E7628" />
    </linearGradient>
    <linearGradient id="crestBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142B20" />
      <stop offset="100%" stop-color="#08140E" />
    </linearGradient>
    <linearGradient id="peakLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D9E3EC" />
    </linearGradient>
    <linearGradient id="peakShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F4735" />
      <stop offset="100%" stop-color="#0E2319" />
    </linearGradient>
  </defs>

  <!-- Outer Ring with fine luxury gold border -->
  <circle cx="50" cy="50" r="47" fill="url(#crestBg)" stroke="url(#crestGold)" stroke-width="2.5" />
  <circle cx="50" cy="50" r="43.5" stroke="url(#crestGold)" stroke-width="0.8" stroke-dasharray="2 1.5" stroke-opacity="0.6" />

  <!-- Radiant Golden Sunrise behind peaks -->
  <circle cx="50" cy="38" r="10" fill="url(#crestGold)" opacity="0.9" />
  <!-- Radiant rays -->
  <g stroke="url(#crestGold)" stroke-width="1.2" stroke-linecap="round" opacity="0.75">
    <line x1="50" y1="23" x2="50" y2="19" />
    <line x1="39" y1="27" x2="36" y2="24" />
    <line x1="61" y1="27" x2="64" y2="24" />
    <line x1="33" y1="38" x2="29" y2="38" />
    <line x1="67" y1="38" x2="71" y2="38" />
  </g>

  <!-- Background Mountain Range (Subtle) -->
  <polygon points="18,72 36,46 54,72" fill="#133626" opacity="0.85" />
  <polygon points="46,72 64,48 82,72" fill="#102E20" opacity="0.85" />

  <!-- Primary Majestic Peak (Trishul / Nanda Devi Crest) -->
  <!-- Left Sunny Slope (Snow White) -->
  <polygon points="50,28 26,72 50,72" fill="url(#peakLeft)" />
  <!-- Right Shaded Slope (Deep Alpine Pine) -->
  <polygon points="50,28 50,72 74,72" fill="url(#peakShade)" />
  
  <!-- Snowcap Top Facets -->
  <polygon points="50,28 41,44 50,41" fill="#FFFFFF" />
  <polygon points="50,28 50,41 59,44" fill="#C8D6E2" />

  <!-- Secondary Fore peak (Cedar Ridge) -->
  <polygon points="34,48 18,73 34,73" fill="#FFFFFF" opacity="0.95" />
  <polygon points="34,48 34,73 50,73" fill="#1A4230" />
  <polygon points="34,48 28,58 34,56" fill="#FFFFFF" />
  <polygon points="34,48 34,56 40,58" fill="#BCCEDB" />

  <!-- Clean Gold Base Horizon Line -->
  <rect x="16" y="72" width="68" height="2" fill="url(#crestGold)" rx="1" />
  
  <!-- Alpine Star Zenith Sparkle -->
  <path d="M50 11 L51.3 14.8 L55.1 16.1 L51.3 17.4 L50 21.2 L48.7 17.4 L44.9 16.1 L48.7 14.8 Z" fill="url(#crestGold)" />
  <circle cx="27" cy="22" r="1.2" fill="url(#crestGold)" opacity="0.85" />
  <circle cx="73" cy="22" r="1.2" fill="url(#crestGold)" opacity="0.85" />

  <!-- Altitude Monogram Rim at Bottom -->
  <path id="curve" d="M 20 81 A 38 38 0 0 0 80 81" fill="transparent" />
  <text font-family="'Inter', sans-serif" font-size="6.5" font-weight="700" fill="url(#crestGold)" letter-spacing="3">
    <textPath href="#curve" startOffset="50%" text-anchor="middle">
      6,942 FT • KASAR DEVI
    </textPath>
  </text>
</svg>
