<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F291E"/>
      <stop offset="60%" stop-color="#1A382B"/>
      <stop offset="100%" stop-color="#2D5A47"/>
    </linearGradient>
    <linearGradient id="peakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAFAF7"/>
      <stop offset="100%" stop-color="#D1D5DB"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#skyGrad)"/>
  <!-- Mountain Peaks -->
  <polygon points="120,420 300,180 480,420" fill="url(#peakGrad)" opacity="0.9"/>
  <polygon points="340,460 520,140 700,460" fill="url(#peakGrad)" opacity="0.85"/>
  <polygon points="0,520 180,260 360,520" fill="url(#peakGrad)" opacity="0.7"/>
  <!-- Snow caps -->
  <polygon points="300,180 250,250 300,230 350,250" fill="#FFFFFF"/>
  <polygon points="520,140 460,220 520,200 580,220" fill="#FFFFFF"/>
  <!-- Base gradient -->
  <rect y="440" width="800" height="160" fill="#0F291E" opacity="0.95"/>
  <text x="400" y="520" font-family="'Playfair Display', serif" font-size="28" fill="#CBA147" text-anchor="middle" font-weight="600">The Kasar Himalayan Heights</text>
  <text x="400" y="555" font-family="'Inter', sans-serif" font-size="16" fill="#FAFAF7" text-anchor="middle" opacity="0.8">Kasar Devi, Uttarakhand • 7,500 ft</text>
</svg>
